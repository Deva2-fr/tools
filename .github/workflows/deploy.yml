name: Build and Deploy (VPN)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_LOWER: deva2-fr/tools

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, tests et build : la construction des images (donc le déploiement) n'a lieu que si tout est vert.
  checks:
    uses: ./.github/workflows/ci.yml

  # Construit les images (sur une PR : construction seule, sans publication).
  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le worker réutilise l'image backend (même code, autre commande).
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Vérifie que les migrations Alembic reproduisent exactement les modèles SQLAlchemy sur un vrai PostgreSQL :
  # échoue si un modèle a été modifié sans créer la migration correspondante.
  check-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/shadow
      SECRET_KEY: ci-secret-key-not-used-in-production
      ENCRYPTION_KEY: ci-encryption-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Appliquer toutes les migrations sur PostgreSQL
        run: alembic upgrade head

      - name: Comparer les migrations avec les modèles
        run: |
          if ! alembic check; then
            echo "::error::Les modèles (app/models.py) ont changé sans migration. Lancer : cd backend && alembic revision --autogenerate -m '<nom>'"
            exit 1
          fi

  deploy:
    needs: [build, check-migrations]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          ls -la docker-compose.prod.yml caddy/Caddyfile.proxy scripts/deploy.sh

      - name: Install Strongswan
        run: |
          sudo apt-get update
          sudo apt-get install -y strongswan strongswan-pki libcharon-extra-plugins libcharon-extauth-plugins libstrongswan-standard-plugins ca-certificates
          sudo mkdir -p /etc/ipsec.d/cacerts
          sudo ln -nsf /etc/ssl/certs/* /etc/ipsec.d/cacerts/

      - name: Configure and Connect VPN (IKEv2)
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          printf "%s : EAP \"%s\"\n" "${VPN_USER}" "${VPN_PASSWORD}" | sudo tee /etc/ipsec.secrets > /dev/null

          cat <<EOF | sudo tee /etc/ipsec.conf
          config setup
              charondebug="ike 1, knl 1, cfg 0"
              uniqueids=no

          conn freebox
              keyexchange=ikev2
              fragmentation=yes
              dpdaction=clear
              dpddelay=300s
              eap_identity=${VPN_USER}
              left=%defaultroute
              leftauth=eap-mschapv2
              leftid=%any
              leftsourceip=%config
              right=${VPN_SERVER}
              rightid=%any
              rightauth=pubkey
              rightsubnet=0.0.0.0/0
              rightca=%same
              auto=add
          EOF

          sudo ipsec restart
          sleep 5
          sudo ipsec up freebox

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS="-i $HOME/.ssh/id_deploy"
          REMOTE="$SSH_USER@$SSH_HOST"

          # Create deploy directory
          ssh $SSH_OPTS "$REMOTE" "mkdir -p $DEPLOY_PATH/caddy $DEPLOY_PATH/scripts"

          # Copy deployment files (compose prod, Caddyfile du mode « derrière un reverse proxy », script)
          scp $SSH_OPTS docker-compose.prod.yml "$REMOTE:$DEPLOY_PATH/docker-compose.prod.yml"
          scp $SSH_OPTS caddy/Caddyfile.proxy "$REMOTE:$DEPLOY_PATH/caddy/Caddyfile.proxy"
          scp $SSH_OPTS scripts/deploy.sh "$REMOTE:$DEPLOY_PATH/scripts/deploy.sh"

          # Create .env file on server only if it doesn't exist (le contenu passe par l'entrée standard)
          ssh $SSH_OPTS "$REMOTE" "if [ ! -f $DEPLOY_PATH/.env ]; then umask 077; cat > $DEPLOY_PATH/.env; fi" <<< "$ENV_FILE"

          # Deploy : le jeton GHCR est transmis par l'entrée standard (pas dans la ligne de commande)
          printf '%s\n' "$GITHUB_TOKEN" | ssh $SSH_OPTS "$REMOTE" \
            "cd $DEPLOY_PATH && chmod +x scripts/deploy.sh && IMAGE_TAG=${{ github.sha }} GH_ACTOR=${{ github.actor }} bash scripts/deploy.sh"

      - name: Stop VPN
        if: always()
        run: |
          sudo ipsec down freebox || true
          sudo ipsec stop || true
