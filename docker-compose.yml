# Deva2 Hub – production.   Démarrer : `make up`   (voir docs/CONFIGURATION.md)
name: deva2-hub

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD}@db:5432/hub
    DATA_DIR: /data
  volumes:
    - hub_data:/data
  networks: [db_net, web]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env (make secrets)}
      POSTGRES_DB: hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db_net]  # réseau isolé : aucune sortie Internet, aucun port publié
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]

  api:
    <<: *backend

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [api, frontend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  db_net:
    internal: true  # la base de données est injoignable depuis Internet
  web:              # api/worker doivent sortir sur Internet (monitoring, Microsoft, Google, NVD)

volumes:
  pgdata:
  hub_data:
  caddy_data:
  caddy_config:
