[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008 : Depends() en argument par défaut = usage normal de FastAPI ; E501 : géré par le formateur

[tool.pytest.ini_options]
testpaths = ["tests"]
