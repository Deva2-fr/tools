# ============================================================================
#  Deva2 Hub - vhost Apache du serveur reverse proxy (edge)
#  A copier dans /etc/apache2/sites-available/tools.deva2.fr.conf puis : a2ensite tools.deva2.fr
#  Guide : docs/DEPLOIEMENT.md (etape 2)
#
#  Le Hub tourne sur la VM Deva2 (192.168.11.134) et ecoute UNIQUEMENT sur le port interne 31847
#  (variables HUB_BIND=192.168.11.134 et HUB_PORT=31847 dans le .env de production).
#  Modules requis : a2enmod ssl proxy proxy_http headers
# ============================================================================

# --- HTTP : sert le defi Let's Encrypt, redirige tout le reste vers HTTPS ---
<VirtualHost *:80>
    ServerName tools.deva2.fr
    DocumentRoot /var/www/html

    <Location /.well-known/acme-challenge>
        Require all granted
    </Location>

    # Tout sauf le defi ACME -> HTTPS
    RedirectMatch 301 ^/(?!\.well-known/acme-challenge/)(.*)$ https://tools.deva2.fr/$1
</VirtualHost>

# --- HTTPS ---
<VirtualHost *:443>
    ServerName tools.deva2.fr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tools.deva2.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tools.deva2.fr/privkey.pem
    # Decommentez si vos autres sites l'utilisent :
    # Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    # La generation d'un PDF Google peut prendre quelques secondes
    ProxyTimeout 120
    # 20 Mo (le Hub accepte 15 Mo par document)
    LimitRequestBody 20971520

    # Le Hub doit savoir que le visiteur est en HTTPS (cookies "Secure").
    # X-Forwarded-For (vraie IP du visiteur) est ajoute automatiquement par mod_proxy.
    RequestHeader set X-Forwarded-Proto "https"
    # Le Hub s'authentifie par cookie : on ne lui transmet pas les identifiants de la Basic Auth.
    RequestHeader unset Authorization

    # --- Protection supplementaire par mot de passe (en plus du login du Hub) ---
    # Fichier dedie : sudo htpasswd -c /etc/apache2/.htpasswd_tools <utilisateur>
    <Location />
        AuthType Basic
        AuthName "Deva2 Hub"
        AuthUserFile /etc/apache2/.htpasswd_tools
        Require valid-user
    </Location>

    # URL qui doivent rester accessibles SANS mot de passe Apache :
    #   /api/health      auto-surveillance du Hub (ne revele rien)
    #   /api/webhooks/   alertes envoyees par vos outils externes (protegees par le jeton WEBHOOK_TOKEN)
    #   /statut, /assets/, /favicon.svg, /api/public/   page de statut publique pour vos clients
    # Si vous ne voulez pas de page publique, retirez "statut$|assets/|favicon\.svg$|api/public/".
    <LocationMatch "^/(api/health$|api/webhooks/|api/public/|statut$|assets/|favicon\.svg$)">
        Require all granted
    </LocationMatch>

    # --- Relais vers la VM Deva2 (port interne du Hub, PAS 3000 qui est Formasyl) ---
    ProxyPass / http://192.168.11.134:31847/
    ProxyPassReverse / http://192.168.11.134:31847/

    ErrorLog ${APACHE_LOG_DIR}/tools_error.log
    CustomLog ${APACHE_LOG_DIR}/tools_access.log combined
</VirtualHost>
